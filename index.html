<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VanSecure — Get Your Free Risk Score</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Poppins', sans-serif; font-weight: 400; }
  .axm-display { font-family: 'Poppins', sans-serif; font-weight: 700; }
  .axm-mono { font-family: 'IBM Plex Mono', monospace; }
  input[type="range"] { accent-color: #3FA9F5; }
  .quiz-question { font-family: 'Poppins', sans-serif; font-size: 0.875rem; font-weight: 500; color: #cbd5e1; }
  .quiz-answer { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; }
  select.quiz-select { min-height: 44px; white-space: normal; }
</style>
</head>
<body class="bg-[#223243] text-slate-300">

<div id="app"></div>

<script>
const MAKE_MODELS = {
  "Ford": ["Transit", "Transit Custom", "Transit Connect", "Transit Courier"],
  "Mercedes-Benz": ["Sprinter", "Vito", "Citan"],
  "Volkswagen": ["Transporter", "Caddy", "Crafter"],
  "Vauxhall": ["Vivaro", "Combo", "Movano"],
  "Renault": ["Trafic", "Master", "Kangoo"],
  "Peugeot": ["Boxer", "Expert", "Partner"],
  "Citroën": ["Relay", "Berlingo", "Dispatch"],
  "Toyota": ["Proace", "Proace City"],
  "Nissan": ["Primastar", "NV300", "Townstar"],
  "Other / Not Listed": ["Other"],
};
const MAKES = Object.keys(MAKE_MODELS);
const YEARS = Array.from({ length: 2026 - 2000 + 1 }, (_, i) => 2026 - i);

const VAN_USES = [
  { id: "tradesperson", label: "Tradesperson" },
  { id: "campervan", label: "Campervan" },
  { id: "deliveries", label: "Deliveries" },
  { id: "fleet", label: "Fleet of Vans" },
];

const STOLEN_OPTIONS = [
  { id: "yes", label: "Yes" },
  { id: "no", label: "No" },
  { id: "close_call", label: "I’ve come very close" },
];

const WORRIES = [
  { id: "losing_tools", label: "Losing Tools" },
  { id: "van_damage", label: "Damage to my van" },
  { id: "losing_work", label: "Losing work" },
  { id: "liability", label: "Not being able to prove an accident wasn’t my fault" },
  { id: "staff_misbehaviour", label: "Staff misbehaving in our vans" },
];

const EXISTING_UPGRADES = [
  { id: "deadlocks", label: "Deadlocks", category: "locking" },
  { id: "shields", label: "Door Shields / Plates", category: "shields" },
  { id: "dashcam", label: "Dash Cam", category: "dashcam" },
  { id: "tracker", label: "Tracker", category: "tracking" },
];

const INTERESTED_UPGRADES = [
  { id: "hook_locks", label: "Mechanical Hook Locks", category: "locking" },
  { id: "electronic_deadbolts", label: "Electronic Deadbolts", category: "locking" },
  { id: "external_shields", label: "External Door Shields", category: "shields" },
  { id: "internal_shields", label: "Hidden Internal Door Shields", category: "shields" },
  { id: "dashcams", label: "Dash Cams", category: "dashcam" },
  { id: "tracking", label: "Tracking", category: "tracking" },
];

const BUDGETS = [
  { id: "b1", label: "£250 – £500 +VAT" },
  { id: "b2", label: "£501 – £750 +VAT" },
  { id: "b3", label: "£751 – £999 +VAT" },
  { id: "unsure", label: "Unsure — I need more information" },
];

const CATEGORY_WEIGHTS = { locking: 30, shields: 25, dashcam: 20, tracking: 20, app: 5 };


const LEAD_WEBHOOK_URL = "";

function sendLeadToWebhook(payload) {
  if (!LEAD_WEBHOOK_URL) return;
  fetch(LEAD_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).catch((err) => {
    console.error("VanSecure lead webhook failed:", err);
  });
}

const state = {
  step: 0,
  vanInfo: {
    make: "", model: "", uses: new Set(),
  },
  worries: { stolen: "", worryList: new Set() },
  upgrades: {
    existing: new Set(),
    existingOther: "",
    interested: new Set(),
    interestedOther: "",
    wantsApp: "",
    budget: "",
  },
  contact: { name: "", phone: "", email: "", postcode: "", goodTime: "", consent: false },
  submitted: false,
};

const STEP_LABELS = ["Your Van", "Risk Profile", "Security Wants", "Your Report"];

function computeScores() {
  const haveCategory = new Set();
  state.upgrades.existing.forEach((id) => {
    const item = EXISTING_UPGRADES.find((u) => u.id === id);
    if (item) haveCategory.add(item.category);
  });

  const possibleCategory = new Set(haveCategory);
  state.upgrades.interested.forEach((id) => {
    const item = INTERESTED_UPGRADES.find((u) => u.id === id);
    if (item) possibleCategory.add(item.category);
  });
  if (state.upgrades.wantsApp === "yes") possibleCategory.add("app");

  let current = 0;
  let possible = 0;
  Object.entries(CATEGORY_WEIGHTS).forEach(([cat, weight]) => {
    if (haveCategory.has(cat)) current += weight;
    if (possibleCategory.has(cat)) possible += weight;
  });

  return {
    current: Math.min(100, current),
    possible: Math.min(100, Math.max(current, possible)),
  };
}

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

function dualGaugeSVG(current, possible) {
  const cx = 130, cy = 128, strokeWidth = 16;
  const rOuter = 104, rInner = 82;
  const angleForPercent = (p) => 180 - (p / 100) * 180;

  const arc = (r) => `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`;
  const circOuter = Math.PI * rOuter;
  const circInner = Math.PI * rInner;

  const ticks = [0, 25, 50, 75, 100].map((t) => {
    const a = angleForPercent(t);
    const inner = polarPoint(cx, cy, rOuter + strokeWidth / 2 + 5, a);
    const outer = polarPoint(cx, cy, rOuter + strokeWidth / 2 + 12, a);
    return `<line x1="${inner.x}" y1="${inner.y}" x2="${outer.x}" y2="${outer.y}" stroke="#475569" stroke-width="2" />`;
  }).join("");

  return `
    <svg viewBox="0 0 260 150" class="w-full max-w-[320px]">
      <path d="${arc(rOuter)}" fill="none" stroke="#1e293b" stroke-width="${strokeWidth}" stroke-linecap="round" />
      <path d="${arc(rOuter)}" fill="none" stroke="#3FA9F5" stroke-width="${strokeWidth}" stroke-linecap="round"
        stroke-dasharray="${circOuter}" stroke-dashoffset="${circOuter * (1 - possible / 100)}"
        style="transition: stroke-dashoffset 600ms ease" />
      <path d="${arc(rInner)}" fill="none" stroke="#1e293b" stroke-width="${strokeWidth}" stroke-linecap="round" />
      <path d="${arc(rInner)}" fill="none" stroke="#64748B" stroke-width="${strokeWidth}" stroke-linecap="round"
        stroke-dasharray="${circInner}" stroke-dashoffset="${circInner * (1 - current / 100)}"
        style="transition: stroke-dashoffset 600ms ease" />
      ${ticks}
    </svg>
  `;
}

53.1722 36.8149V28.6412C53.1722 26.0257 52.7015 24.5871 51.4549 23.4493C50.0938 22.2331 48.0839 21.6053 45.4761 21.6053C40.6041 21.6053 38.1362 23.5932 37.8055 27.6865H42.3595H42.3722ZM103.241 28.8243C103.635 26.7319 104.92 25.581 106.892 25.581C108.864 25.581 110.047 26.7188 110.263 28.8243H103.241ZM115.491 32.5123C115.491 30.0405 115.237 28.3927 114.626 26.8365C113.341 23.4885 110.581 21.6053 106.93 21.6053C101.702 21.6053 98.0892 25.4371 98.0892 30.9952C98.0892 36.5533 101.638 40.3459 106.968 40.3459C111.09 40.3459 114.308 38.1357 115.275 34.6701H110.11C109.423 35.7686 108.469 36.2525 107.108 36.2525C104.92 36.2525 103.521 34.9317 103.203 32.4992H115.491V32.5123Z" fill="#F5F9FC"></path></svg>`;

function iconTag(name, size, cls) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${cls || ''}"></i>`;
}

function selectCard({ selected, label, shape, onAttr }) {
  return `
    <button type="button" ${onAttr}
      class="w-full text-left rounded-md border px-3.5 py-3 flex items-center gap-3 transition-all
        ${selected ? "bg-[#3FA9F5]/10 border-[#3FA9F5] shadow-[0_0_0_1px_rgba(63,169,245,0.35)]" : "bg-[#131d27] border-slate-700/50 hover:border-slate-600"}">
      <span class="flex-shrink-0 w-4 h-4 flex items-center justify-center border transition-colors ${shape}
        ${selected ? "bg-[#3FA9F5] border-[#3FA9F5]" : "border-slate-600"}">
        ${selected ? iconTag("check", 11, "text-white") : ""}
      </span>
      <span class="quiz-answer ${selected ? "text-white font-medium" : "text-slate-300"}">${label}</span>
    </button>
  `;
}

function progressHTML() {
  return `
    <div class="flex items-center gap-2 mb-8" aria-label="Quiz progress">
      ${STEP_LABELS.map((label, i) => {
        const stepNum = i + 1;
        const active = stepNum === state.step;
        const done = stepNum < state.step;
        return `
          <div class="flex-1">
            <div class="w-full h-1.5 rounded-full ${done ? "bg-[#34D399]" : active ? "bg-[#3FA9F5]" : "bg-slate-700/50"}"
              role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="1" aria-valuenow="${done || active ? 1 : 0}"></div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function navButtonsHTML(canNext) {
  const isLast = state.step === 4;
  return `
    <div class="flex items-center gap-3 mt-8">
      ${state.step > 1 ? `
        <button type="button" data-action="back" class="px-5 py-3 rounded-md border border-slate-700/50 text-slate-300 text-sm font-medium hover:border-slate-600 transition-colors">
          Back
        </button>` : ""}
      ${!isLast ? `
        <button type="button" data-action="next" ${canNext ? "" : "disabled"}
          class="flex-1 flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm px-6 py-3.5 rounded-md transition-all
            ${canNext ? "bg-[#3FA9F5] hover:bg-[#2594e2] text-white" : "bg-slate-800 text-slate-500 cursor-not-allowed"}">
          Continue ${iconTag("arrow-right", 16)}
        </button>` : ""}
    </div>
  `;
}

function introHTML() {
  return `
    <div class="text-center">
      <div class="inline-flex items-center gap-1.5 axm-mono text-[11px] tracking-wider uppercase text-[#3FA9F5] bg-[#3FA9F5]/10 border border-[#3FA9F5]/30 rounded-full px-3.5 py-1.5 mb-6">
        <span class="w-1.5 h-1.5 bg-[#3FA9F5] rounded-full"></span>
        Free 60-Second Risk Check
      </div>

      <h1 class="axm-display text-3xl sm:text-4xl leading-tight text-white mb-4">
        What could you lose if your van is <span class="text-[#3FA9F5]">attacked?</span>
      </h1>

      <p class="text-sm text-slate-400 max-w-sm mx-auto mb-7">
        Most tradespeople never find out what they stand to lose until it's already too late. Take this 60-second quiz, see where the gaps are, and get a tailored plan to close them.
      </p>

      <button type="button" data-action="start-quiz"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm px-8 py-4 rounded-full bg-[#3FA9F5] hover:bg-[#2594e2] active:bg-[#1a80c9] text-white transition-colors shadow-lg shadow-[#3FA9F5]/20">
        Start The Quiz ${iconTag("arrow-right", 16)}
      </button>

      <div class="mt-6 flex items-center justify-center gap-2.5 border border-slate-700/50 bg-[#131d27] rounded-lg px-4 py-3 text-sm">
        <span class="w-6 h-6 rounded-full bg-[#34D399]/10 border border-[#34D399]/30 flex items-center justify-center flex-shrink-0">
          ${iconTag("shield-check", 13, "text-[#34D399]")}
        </span>
        <span class="text-slate-300"><span class="text-[#34D399] font-semibold">Over 10,000</span> UK tradespeople already protected</span>
      </div>

      <a href="https://www.google.com/search?q=VanSecure+Google+Reviews" target="_blank" rel="noopener"
        class="inline-flex items-center justify-center gap-1.5 mt-4 text-[#3FA9F5] hover:text-white transition-colors">
        ${Array.from({ length: 5 }).map(() => `<i data-lucide="star" style="width:13px;height:13px;fill:#3FA9F5;color:#3FA9F5"></i>`).join("")}
        <span class="axm-mono text-[11px] underline underline-offset-2">View our 5-star Google reviews</span>
      </a>
    </div>
  `;
}

function step1HTML() {
  const { make, model, uses } = state.vanInfo;
  const models = make ? [...MAKE_MODELS[make]].sort((a, b) => a.localeCompare(b, "en-GB")) : [];
  const hasVanDetails = !!(make && model);
  const canNext = hasVanDetails && uses.size > 0;

  return `
    <div>
      <h2 class="axm-display uppercase tracking-wide text-lg text-white mb-5">Tell Us About Your Van</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="quiz-question block">Make</label>
          <select data-field="make" class="quiz-select w-full mt-1 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2.5 text-sm text-[#E7EEF5] focus:outline-none focus:border-[#3FA9F5]">
            <option value="">Select Make</option>
            ${MAKES.map((m) => `<option value="${m}" ${make === m ? "selected" : ""}>${m}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="quiz-question block">Model</label>
          <select data-field="model" ${make ? "" : "disabled"} class="quiz-select w-full mt-1 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2.5 text-sm text-[#E7EEF5] focus:outline-none focus:border-[#3FA9F5] disabled:bg-[#223243] disabled:text-slate-500">
            <option value="">${make ? "Select Model" : "Select Make first"}</option>
            ${models.map((m) => `<option value="${m}" ${model === m ? "selected" : ""}>${m}</option>`).join("")}
          </select>
        </div>
      </div>

      <label class="quiz-question mt-6 block">How do you use your van? (please select all that apply)</label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
        ${VAN_USES.map((u) => selectCard({
          selected: uses.has(u.id),
          label: u.label,
          shape: "rounded",
          onAttr: `data-action="toggle-use" data-id="${u.id}"`,
        })).join("")}
      </div>

      ${navButtonsHTML(canNext)}
    </div>
  `;
}

function step2HTML() {
  const { stolen, worryList } = state.worries;
  const canNext = !!stolen;

  return `
    <div>
      <h2 class="axm-display uppercase tracking-wide text-lg text-white mb-5">Your Risk Profile</h2>

      <label class="quiz-question block">Have you ever had your tools stolen?</label>
      <div class="grid grid-cols-1 gap-2 mt-2 mb-5">
        ${STOLEN_OPTIONS.map((o) => selectCard({
          selected: stolen === o.id,
          label: o.label,
          shape: "rounded-full",
          onAttr: `data-action="set-stolen" data-id="${o.id}"`,
        })).join("")}
      </div>

      <label class="quiz-question block">What worries keep you up at night? (please select all that apply)</label>
      <div class="grid grid-cols-1 gap-2 mt-2">
        ${WORRIES.map((w) => selectCard({
          selected: worryList.has(w.id),
          label: w.label,
          shape: "rounded",
          onAttr: `data-action="toggle-worry" data-id="${w.id}"`,
        })).join("")}
      </div>

      ${navButtonsHTML(canNext)}
    </div>
  `;
}

function step3HTML() {
  const { existing, existingOther, interested, interestedOther, wantsApp, budget } = state.upgrades;
  const canNext = interested.size > 0 && !!budget;

  return `
    <div>
      <h2 class="axm-display uppercase tracking-wide text-lg text-white mb-5">SECURITY</h2>

      <label class="quiz-question block">Do you have any upgrades already? (please select all that apply)</label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
        ${EXISTING_UPGRADES.map((u) => selectCard({
          selected: existing.has(u.id),
          label: u.label,
          shape: "rounded",
          onAttr: `data-action="toggle-existing" data-id="${u.id}"`,
        })).join("")}
      </div>
      <input type="text" data-field="existingOther" value="${existingOther}" placeholder="Other (please specify)"
        class="quiz-answer w-full mt-2 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2.5 text-[#E7EEF5] placeholder-slate-500 focus:outline-none focus:border-[#3FA9F5]" />

      <label class="quiz-question mt-5 block">What are you interested in fitting? <span class="text-[#3FA9F5]">*</span> (please select all that apply)</label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
        ${INTERESTED_UPGRADES.map((u) => selectCard({
          selected: interested.has(u.id),
          label: u.label,
          shape: "rounded",
          onAttr: `data-action="toggle-interested" data-id="${u.id}"`,
        })).join("")}
      </div>
      <input type="text" data-field="interestedOther" value="${interestedOther}" placeholder="Other (please specify)"
        class="quiz-answer w-full mt-2 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2.5 text-[#E7EEF5] placeholder-slate-500 focus:outline-none focus:border-[#3FA9F5]" />

      <label class="quiz-question mt-5 block">Would you like to monitor your van from your phone?</label>
      <div class="grid grid-cols-2 gap-2 mt-2">
        ${["yes", "no"].map((v) => selectCard({
          selected: wantsApp === v,
          label: v === "yes" ? "Yes" : "No",
          shape: "rounded-full",
          onAttr: `data-action="set-wants-app" data-id="${v}"`,
        })).join("")}
      </div>

      <label class="quiz-question mt-5 block">What is your budget? <span class="text-[#3FA9F5]">*</span></label>
      <div class="grid grid-cols-1 gap-2 mt-2">
        ${BUDGETS.map((b) => selectCard({
          selected: budget === b.id,
          label: b.label,
          shape: "rounded-full",
          onAttr: `data-action="set-budget" data-id="${b.id}"`,
        })).join("")}
      </div>

      ${navButtonsHTML(canNext)}
    </div>
  `;
}

function step4HTML() {
  const { current, possible } = computeScores();
  const gap = possible - current;
  const { name, phone, email, postcode, goodTime, consent } = state.contact;
  const canSubmit = name.trim() && phone.trim() && email.trim() && consent;

  if (state.submitted) {
    return `
      <div class="flex flex-col items-center text-center py-6">
        <div class="w-14 h-14 rounded-full bg-[#34D399]/10 border border-[#34D399]/30 flex items-center justify-center text-[#34D399] mb-4">
          ${iconTag("check-circle-2", 28)}
        </div>
        <h3 class="axm-display uppercase tracking-wide text-lg mb-2 text-white">Your Risk Report Is On Its Way</h3>
        <p class="text-sm text-slate-300 max-w-sm mb-1">
          Thanks${name ? `, ${name}` : ""}. Your current protection score is
          <span class="text-[#64748B] axm-mono font-semibold">${current}%</span> —
          with a tailored VanSecure setup you could reach
          <span class="text-[#3FA9F5] axm-mono font-semibold">${possible}%</span>.
        </p>
        <p class="text-sm text-slate-300 max-w-sm">
          We'll call you${goodTime ? ` ${goodTime.toLowerCase()}` : ""} to talk through your options and send a no-obligation quote.
        </p>
        <a href="https://wa.me/+447858192831" target="_blank" rel="noopener"
          class="mt-5 inline-flex items-center gap-2 axm-display uppercase tracking-wide text-xs px-5 py-2.5 rounded-md bg-[#3FA9F5] hover:bg-[#2594e2] text-white transition-colors">
          ${iconTag("message-circle", 14)} Or Message Us Now
        </a>
      </div>
    `;
  }

  return `
    <div>
      <h2 class="axm-display uppercase tracking-wide text-lg text-white mb-1">Your Van Security Report</h2>
      <p class="text-sm text-slate-400 mb-5">Here's where you stand, and what's possible.</p>

      <div class="border border-slate-700/50 rounded-lg bg-[#192633] p-5 flex flex-col items-center mb-2">
        ${dualGaugeSVG(current, possible)}
        <div class="grid grid-cols-2 gap-4 w-full max-w-xs -mt-4">
          <div class="text-center">
            <div class="axm-mono text-2xl font-semibold text-[#64748B]">${current}%</div>
            <div class="axm-mono text-[9px] tracking-[0.2em] text-slate-400 uppercase mt-0.5">Current Score</div>
          </div>
          <div class="text-center">
            <div class="axm-mono text-2xl font-semibold text-[#3FA9F5]">${possible}%</div>
            <div class="axm-mono text-[9px] tracking-[0.2em] text-slate-400 uppercase mt-0.5">Possible Score</div>
          </div>
        </div>
      </div>
      ${gap > 0 ? `
        <div class="flex items-center gap-2 justify-center text-[#34D399] text-sm mb-5">
          ${iconTag("trending-up", 15)} You could close a ${gap}-point gap with a tailored VanSecure setup
        </div>` : `<div class="mb-5"></div>`}

      <form id="lead-form" class="border border-slate-700/50 rounded-lg bg-[#192633] p-4 space-y-3">
        <h3 class="axm-display uppercase tracking-wide text-sm text-[#3FA9F5] mb-1">Get Your Free No-Obligation Quote</h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="axm-mono text-[10px] tracking-wider text-slate-400 uppercase">Name</label>
            <input type="text" data-field="name" value="${name}" placeholder="Your name"
              class="w-full mt-1 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2 text-sm text-[#E7EEF5] placeholder-slate-500 focus:outline-none focus:border-[#3FA9F5]" />
          </div>
          <div>
            <label class="axm-mono text-[10px] tracking-wider text-slate-400 uppercase">Phone Number</label>
            <input type="tel" data-field="phone" value="${phone}" placeholder="07000 000000"
              class="w-full mt-1 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2 text-sm text-[#E7EEF5] placeholder-slate-500 focus:outline-none focus:border-[#3FA9F5]" />
          </div>
        </div>
        <div>
          <label class="axm-mono text-[10px] tracking-wider text-slate-400 uppercase">Email</label>
          <input type="email" data-field="email" value="${email}" placeholder="you@example.com"
            class="w-full mt-1 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2 text-sm text-[#E7EEF5] placeholder-slate-500 focus:outline-none focus:border-[#3FA9F5]" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="axm-mono text-[10px] tracking-wider text-slate-400 uppercase">Postcode</label>
            <input type="text" data-field="postcode" value="${postcode}" placeholder="e.g. TN14"
              class="w-full mt-1 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2 text-sm text-[#E7EEF5] placeholder-slate-500 focus:outline-none focus:border-[#3FA9F5]" />
          </div>
          <div>
            <label class="axm-mono text-[10px] tracking-wider text-slate-400 uppercase">Good Time To Call?</label>
            <select data-field="goodTime" class="w-full mt-1 bg-[#131d27] border border-slate-700/50 rounded-md px-3 py-2 text-sm text-[#E7EEF5] focus:outline-none focus:border-[#3FA9F5]">
              <option value="">Select a time</option>
              <option value="Morning" ${goodTime === "Morning" ? "selected" : ""}>Morning</option>
              <option value="Afternoon" ${goodTime === "Afternoon" ? "selected" : ""}>Afternoon</option>
              <option value="Evening" ${goodTime === "Evening" ? "selected" : ""}>Evening</option>
            </select>
          </div>
        </div>

        <label class="flex items-start gap-2.5 pt-1 cursor-pointer">
          <input type="checkbox" data-field="consent" ${consent ? "checked" : ""}
            class="mt-0.5 flex-shrink-0 w-4 h-4 rounded border-slate-600 text-[#3FA9F5] focus:ring-[#3FA9F5]" />
          <span class="text-[12px] text-slate-400 leading-snug">
            I agree to be contacted by VanSecure about my quote, in line with their
            <a href="https://vansecure.co.uk/privacy-policy/" target="_blank" rel="noopener" class="text-[#3FA9F5] underline hover:no-underline">Privacy Policy</a>.
          </span>
        </label>

        <button type="submit" ${canSubmit ? "" : "disabled"}
          class="w-full mt-2 rounded-md py-3.5 flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm transition-all
            ${canSubmit ? "bg-[#3FA9F5] hover:bg-[#2594e2] text-white" : "bg-slate-800 text-slate-500 cursor-not-allowed"}">
          Get My Free Risk Report ${iconTag("arrow-right", 16)}
        </button>
      </form>

      ${navButtonsHTML(false)}
    </div>
  `;
}

let lucideRetryScheduled = false;
function safeCreateIcons() {
  if (typeof lucide !== "undefined" && lucide.createIcons) {
    lucide.createIcons();
  } else if (!lucideRetryScheduled) {
    lucideRetryScheduled = true;
    setTimeout(() => {
      lucideRetryScheduled = false;
      if (typeof lucide !== "undefined" && lucide.createIcons) lucide.createIcons();
    }, 500);
  }
}

function render() {
  document.getElementById("app").innerHTML = `
    <header class="bg-[#192633] border-b border-slate-700/50">
      <div class="max-w-lg mx-auto px-5 py-3.5 flex items-center gap-2.5">
        ${LOGO_SVG}
        <a href="tel:+442046368841" class="ml-auto text-[11px] sm:text-xs text-[#3FA9F5] hover:text-white transition-colors whitespace-nowrap">
          Call/Whatsapp on 020 4636 8841
        </a>
      </div>
    </header>

    <main class="max-w-lg mx-auto px-5 py-8">
      ${state.step === 0 ? `
        <div class="border border-slate-700/50 rounded-xl bg-[#192633] p-6 sm:p-9 shadow-[0_1px_3px_rgba(0,0,0,0.2)]">
          ${introHTML()}
        </div>
      ` : `
        <div class="border border-slate-700/50 rounded-xl bg-[#192633] p-5 sm:p-7 shadow-[0_1px_3px_rgba(0,0,0,0.2)]">
          ${progressHTML()}
          ${state.step === 1 ? step1HTML() : state.step === 2 ? step2HTML() : state.step === 3 ? step3HTML() : step4HTML()}
        </div>
      `}
    </main>

    <footer class="text-center py-5 text-[11px] text-slate-500">
      Copyright VanSecure © 2026. All rights reserved.
    </footer>
  `;

  safeCreateIcons();
  attachListeners();
}


function attachListeners() {
  const app = document.getElementById("app");

  app.querySelectorAll("[data-action]").forEach((el) => {
    el.addEventListener("click", () => {
      const action = el.dataset.action;
      const id = el.dataset.id;

      if (action === "next") { state.step = Math.min(4, state.step + 1); window.scrollTo(0, 0); render(); return; }
      if (action === "back") { state.step = Math.max(1, state.step - 1); window.scrollTo(0, 0); render(); return; }
      if (action === "start-quiz") { state.step = 1; window.scrollTo(0, 0); render(); return; }

      if (action === "toggle-use") toggleSetItem(state.vanInfo.uses, id);
      if (action === "set-stolen") state.worries.stolen = id;
      if (action === "toggle-worry") toggleSetItem(state.worries.worryList, id);
      if (action === "toggle-existing") toggleSetItem(state.upgrades.existing, id);
      if (action === "toggle-interested") toggleSetItem(state.upgrades.interested, id);
      if (action === "set-wants-app") state.upgrades.wantsApp = id;
      if (action === "set-budget") state.upgrades.budget = id;

      render();
    });
  });

  app.querySelectorAll("[data-field]").forEach((el) => {
    el.addEventListener("change", (e) => {
      const field = el.dataset.field;
      const val = e.target.value;
      if (field === "make") { state.vanInfo.make = val; state.vanInfo.model = ""; render(); return; }
      if (field === "model") { state.vanInfo.model = val; render(); return; }
      if (field === "existingOther") { state.upgrades.existingOther = val; return; }
      if (field === "interestedOther") { state.upgrades.interestedOther = val; return; }
      if (field === "name") { state.contact.name = val; }
      if (field === "phone") { state.contact.phone = val; }
      if (field === "email") { state.contact.email = val; }
      if (field === "postcode") { state.contact.postcode = val; }
      if (field === "goodTime") { state.contact.goodTime = val; }
      if (field === "consent") { state.contact.consent = e.target.checked; }
      updateSubmitState();
    });
    el.addEventListener("input", (e) => {
      const field = el.dataset.field;
      if (["name", "phone", "email", "postcode"].includes(field)) {
        state.contact[field] = e.target.value;
        updateSubmitState();
      }
    });
  });

  const form = document.getElementById("lead-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const { name, phone, email, consent } = state.contact;
      if (!(name.trim() && phone.trim() && email.trim() && consent)) return;

      const { current, possible } = computeScores();
      const payload = {
        vanInfo: {
          ...state.vanInfo,
          uses: Array.from(state.vanInfo.uses),
        },
        worries: {
          stolen: state.worries.stolen,
          worryList: Array.from(state.worries.worryList),
        },
        upgrades: {
          existing: Array.from(state.upgrades.existing),
          existingOther: state.upgrades.existingOther,
          interested: Array.from(state.upgrades.interested),
          interestedOther: state.upgrades.interestedOther,
          wantsApp: state.upgrades.wantsApp,
          budget: state.upgrades.budget,
        },
        scores: { current, possible },
        contact: state.contact,
        submittedAt: new Date().toISOString(),
      };
      console.log("VanSecure risk profile submission:", JSON.stringify(payload, null, 2));
      sendLeadToWebhook(payload);

      state.submitted = true;
      window.scrollTo(0, 0);
      render();
    });
  }
}

function toggleSetItem(set, id) {
  if (set.has(id)) set.delete(id);
  else set.add(id);
}


function updateSubmitState() {
  const btn = document.querySelector('#lead-form button[type="submit"]');
  if (!btn) return;
  const { name, phone, email, consent } = state.contact;
  const canSubmit = name.trim() && phone.trim() && email.trim() && consent;
  btn.disabled = !canSubmit;
  btn.className = `w-full mt-2 rounded-md py-3.5 flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm transition-all
    ${canSubmit ? "bg-[#3FA9F5] hover:bg-[#2594e2] text-white" : "bg-slate-800 text-slate-500 cursor-not-allowed"}`;
}


render();
</script>
</body>
</html>
