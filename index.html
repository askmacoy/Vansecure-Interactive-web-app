/* ==================================================================== */
/* VanSecure — 4-Step Risk Profile Quiz (FB/IG ad landing funnel)        */
/* Direction per Ben's brief: replaces the hardware configurator with a  */
/* short questionnaire that profiles the customer's worries + wants,    */
/* then shows a gamified Current vs Possible risk score before handing  */
/* off to a callback / quote booking form.                              */
/* ==================================================================== */

/* Brand tokens: bg #F4F6F9  panel #FFFFFF  border #DCE3EC              */
/* navy #0F2C54  blue #1F5FA8  gold #C79A3D  success #1F8A5C            */

/* ---------------------- Step 1 data: Make / Model / Year ---------------------- */

const MAKE_MODELS = {
  "Ford": ["Transit", "Transit Custom", "Transit Connect", "Transit Courier"],
  "Mercedes-Benz": ["Sprinter", "Vito", "Citan"],
  "Volkswagen": ["Transporter", "Caddy", "Crafter"],
  "Vauxhall": ["Vivaro", "Combo", "Movano"],
  "Renault": ["Trafic", "Master", "Kangoo"],
  "Peugeot": ["Boxer", "Expert", "Partner"],
  "Citroën": ["Relay", "Berlingo", "Dispatch"],
  "Toyota": ["Proace", "Proace City"],
  "Nissan": ["Primastar", "NV300", "Townstar"],
  "Other / Not Listed": ["Other"],
};
const MAKES = Object.keys(MAKE_MODELS);
const YEARS = Array.from({ length: 2026 - 2000 + 1 }, (_, i) => 2026 - i);

const VAN_USES = [
  { id: "tradesperson", label: "Tradesperson" },
  { id: "campervan", label: "Campervan" },
  { id: "deliveries", label: "Deliveries" },
  { id: "fleet", label: "Fleet of Vans" },
];

/* ---------------------- Step 2 data ---------------------- */

const STOLEN_OPTIONS = [
  { id: "yes", label: "Yes" },
  { id: "no", label: "No" },
  { id: "attempted", label: "Thieves attempted but didn't get in" },
];

const WORRIES = [
  { id: "losing_tools", label: "Losing tools" },
  { id: "van_stolen", label: "Van(s) being stolen" },
  { id: "liability", label: "Having an accident and not being able to prove you weren't at fault" },
  { id: "staff_visibility", label: "Not knowing what your staff are doing in your vans" },
];

/* ---------------------- Step 3 data ---------------------- */

const EXISTING_UPGRADES = [
  { id: "deadlocks", label: "Deadlocks", category: "locking" },
  { id: "shields", label: "Door Shields / Plates", category: "shields" },
  { id: "dashcam", label: "Dash Cam", category: "dashcam" },
  { id: "tracker", label: "Tracker", category: "tracking" },
];

const INTERESTED_UPGRADES = [
  { id: "hook_locks", label: "Mechanical Hook Locks", category: "locking" },
  { id: "electronic_deadbolts", label: "Electronic Deadbolts", category: "locking" },
  { id: "external_shields", label: "External Door Shields", category: "shields" },
  { id: "internal_shields", label: "Hidden Internal Door Shields", category: "shields" },
  { id: "dashcams", label: "Dash Cams", category: "dashcam" },
  { id: "tracking", label: "Tracking", category: "tracking" },
];

const BUDGETS = [
  { id: "b1", label: "£250 – £500 +VAT" },
  { id: "b2", label: "£501 – £750 +VAT" },
  { id: "b3", label: "£751 – £999 +VAT" },
  { id: "unsure", label: "Unsure — I need more information" },
];

/* Score weights — total 100 across categories */
const CATEGORY_WEIGHTS = { locking: 30, shields: 25, dashcam: 20, tracking: 20, app: 5 };

/* ---------------------- Lead delivery ---------------------- */
/*
 * CRM-AGNOSTIC BY DESIGN: on submit we POST the full lead payload as JSON
 * to this webhook URL. Almost every CRM (HubSpot, Pipedrive, Zoho,
 * Salesforce, GoHighLevel, etc.) can receive a webhook either natively or
 * via a one-step Zapier/Make "Catch Webhook" trigger that creates/updates
 * a contact — so this doesn't need to change no matter which CRM is
 * confirmed. Just drop the URL in below once it's available.
 *
 * Leave blank ("") until then — the funnel still works fully without it
 * (console logging + WhatsApp handoff still happen), it just means no
 * lead reaches the CRM yet.
 */
const LEAD_WEBHOOK_URL = ""; // e.g. "https://hooks.zapier.com/hooks/catch/xxxxx/xxxxx/"

function sendLeadToWebhook(payload) {
  if (!LEAD_WEBHOOK_URL) return;
  fetch(LEAD_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).catch((err) => {
    // Never block the customer's flow on this — just log it for us to notice.
    console.error("VanSecure lead webhook failed:", err);
  });
}

/* ---------------------- App state ---------------------- */

const state = {
  step: 1,
  vanInfo: {
    mode: "reg", make: "", model: "", year: "", uses: new Set(),
    regLookupConfirmed: false,
    registration: "", bodyType: "", wheelbase: "", roofHeight: "", colour: "",
  },
  worries: { stolen: "", worryList: new Set() },
  upgrades: {
    existing: new Set(),
    existingOther: "",
    interested: new Set(),
    wantsApp: "",
    budget: "",
  },
  contact: { name: "", phone: "", email: "", postcode: "", goodTime: "", consent: false },
  submitted: false,
};

const STEP_LABELS = ["Your Van", "Risk Profile", "Security Wants", "Your Report"];

/* ---------------------- Scoring ---------------------- */

function computeScores() {
  const haveCategory = new Set();
  state.upgrades.existing.forEach((id) => {
    const item = EXISTING_UPGRADES.find((u) => u.id === id);
    if (item) haveCategory.add(item.category);
  });

  const possibleCategory = new Set(haveCategory);
  state.upgrades.interested.forEach((id) => {
    const item = INTERESTED_UPGRADES.find((u) => u.id === id);
    if (item) possibleCategory.add(item.category);
  });
  if (state.upgrades.wantsApp === "yes") possibleCategory.add("app");

  let current = 0;
  let possible = 0;
  Object.entries(CATEGORY_WEIGHTS).forEach(([cat, weight]) => {
    if (haveCategory.has(cat)) current += weight;
    if (possibleCategory.has(cat)) possible += weight;
  });

  return {
    current: Math.min(100, current),
    possible: Math.min(100, Math.max(current, possible)),
  };
}

/* ---------------------- Dual gauge ---------------------- */

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

function dualGaugeSVG(current, possible) {
  const cx = 130, cy = 128, strokeWidth = 16;
  const rOuter = 104, rInner = 82;
  const angleForPercent = (p) => 180 - (p / 100) * 180;

  const arc = (r) => `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`;
  const circOuter = Math.PI * rOuter;
  const circInner = Math.PI * rInner;

  const ticks = [0, 25, 50, 75, 100].map((t) => {
    const a = angleForPercent(t);
    const inner = polarPoint(cx, cy, rOuter + strokeWidth / 2 + 5, a);
    const outer = polarPoint(cx, cy, rOuter + strokeWidth / 2 + 12, a);
    return `<line x1="${inner.x}" y1="${inner.y}" x2="${outer.x}" y2="${outer.y}" stroke="#C7CFDA" stroke-width="2" />`;
  }).join("");

  return `
    <svg viewBox="0 0 260 150" class="w-full max-w-[320px]">
      <!-- possible (outer, gold) -->
      <path d="${arc(rOuter)}" fill="none" stroke="#F0E4CB" stroke-width="${strokeWidth}" stroke-linecap="round" />
      <path d="${arc(rOuter)}" fill="none" stroke="#C79A3D" stroke-width="${strokeWidth}" stroke-linecap="round"
        stroke-dasharray="${circOuter}" stroke-dashoffset="${circOuter * (1 - possible / 100)}"
        style="transition: stroke-dashoffset 600ms ease" />
      <!-- current (inner, blue) -->
      <path d="${arc(rInner)}" fill="none" stroke="#DCE9F7" stroke-width="${strokeWidth}" stroke-linecap="round" />
      <path d="${arc(rInner)}" fill="none" stroke="#1F5FA8" stroke-width="${strokeWidth}" stroke-linecap="round"
        stroke-dasharray="${circInner}" stroke-dashoffset="${circInner * (1 - current / 100)}"
        style="transition: stroke-dashoffset 600ms ease" />
      ${ticks}
    </svg>
  `;
}

/* ---------------------- Shared UI helpers ---------------------- */

function iconTag(name, size, cls) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${cls || ''}"></i>`;
}

function selectCard({ selected, label, shape, onAttr }) {
  return `
    <button type="button" ${onAttr}
      class="w-full text-left rounded-md border px-3.5 py-3 flex items-center gap-3 transition-all
        ${selected ? "bg-[#EAF1FA] border-[#1F5FA8] shadow-[0_0_0_1px_rgba(31,95,168,0.25)]" : "bg-white border-[#DCE3EC] hover:border-[#B9C3D1]"}">
      <span class="flex-shrink-0 w-4 h-4 flex items-center justify-center border transition-colors ${shape}
        ${selected ? "bg-[#1F5FA8] border-[#1F5FA8]" : "border-[#B9C3D1]"}">
        ${selected ? iconTag("check", 11, "text-white") : ""}
      </span>
      <span class="text-sm ${selected ? "text-[#0F2C54] font-medium" : "text-[#3B4A61]"}">${label}</span>
    </button>
  `;
}

function progressHTML() {
  return `
    <div class="flex items-center gap-2 mb-8">
      ${STEP_LABELS.map((label, i) => {
        const stepNum = i + 1;
        const active = stepNum === state.step;
        const done = stepNum < state.step;
        return `
          <div class="flex-1 flex flex-col items-center gap-1.5">
            <div class="w-full h-1.5 rounded-full ${done ? "bg-[#1F8A5C]" : active ? "bg-[#1F5FA8]" : "bg-[#DCE3EC]"}"></div>
            <span class="axm-mono text-[9px] sm:text-[10px] uppercase tracking-wider text-center ${active ? "text-[#0F2C54] font-medium" : "text-[#8593A8]"}">${label}</span>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function navButtonsHTML(canNext) {
  const isLast = state.step === 4;
  return `
    <div class="flex items-center gap-3 mt-8">
      ${state.step > 1 ? `
        <button type="button" data-action="back" class="px-5 py-3 rounded-md border border-[#DCE3EC] text-[#3B4A61] text-sm font-medium hover:border-[#B9C3D1] transition-colors">
          Back
        </button>` : ""}
      ${!isLast ? `
        <button type="button" data-action="next" ${canNext ? "" : "disabled"}
          class="flex-1 flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm px-6 py-3.5 rounded-md transition-all

          Continue ${iconTag("arrow-right", 16)}
        </button>` : ""}
    </div>
  `;
}

/* ---------------------- Step 1: Van Info ---------------------- */

  const models = make ? MAKE_MODELS[make] : [];

  const canNext = hasVanDetails && uses.size > 0;

  const regPane = `
    <div class="border border-[#DCE3EC] rounded-lg overflow-hidden bg-[#F4F6F9]">

        height="220"
        frameborder="0"
        title="VanSecure registration lookup"
        style="display:block"

    </div>
    ${regLookupConfirmed ? `

          ${iconTag("check-circle-2", 15, "text-[#1F8A5C]")}

  const manualPane = `

          <option value="">Select make</option>

        <label class="axm-mono text-[10px] tracking-wider text-[#5B6B82] uppercase">Model</label>

          <option value="">${make ? "Select model" : "Select make first"}</option>
          ${models.map((m) => `<option value="${m}" ${model === m ? "selected" : ""}>${m}</option>`).join("")}
        </select>
      </div>
      <div>
        <label class="axm-mono text-[10px] tracking-wider text-[#5B6B82] uppercase">Year</label>
        <select data-field="year" class="w-full mt-1 bg-white border border-[#DCE3EC] rounded-md px-3 py-2.5 text-sm text-[#14213D] focus:outline-none focus:border-[#1F5FA8]">
          <option value="">Select year</option>

          selected: stolen === o.id,
          label: o.label,
          shape: "rounded-full",

          <span class="text-[#C79A3D] axm-mono font-semibold">${possible}%</span>.
        </p>
        <p class="text-sm text-[#3B4A61] max-w-sm">
          We'll call you${goodTime ? ` ${goodTime.toLowerCase()}` : ""} to talk through your options and send a no-obligation quote.
        </p>
        <a href="https://wa.me/+447858192831" target="_blank" rel="noopener"
          class="mt-5 inline-flex items-center gap-2 axm-display uppercase tracking-wide text-xs px-5 py-2.5 rounded-md bg-[#C79A3D] text-white hover:bg-[#B78A2F] transition-colors">
          ${iconTag("message-circle", 14)} Or Message Us Now

      </div>

  }

  return `

      <div class="border border-[#DCE3EC] rounded-lg bg-white p-5 flex flex-col items-center mb-2">

          <div>
            <label class="axm-mono text-[10px] tracking-wider text-[#5B6B82] uppercase">Name</label>
            <input type="text" data-field="name" value="${name}" placeholder="Your name"
              class="w-full mt-1 bg-[#F4F6F9] border border-[#DCE3EC] rounded-md px-3 py-2 text-sm text-[#14213D] focus:outline-none focus:border-[#1F5FA8]" />
          </div>
          <div>
            <label class="axm-mono text-[10px] tracking-wider text-[#5B6B82] uppercase">Phone Number</label>
            <input type="tel" data-field="phone" value="${phone}" placeholder="07000 000000"
              class="w-full mt-1 bg-[#F4F6F9] border border-[#DCE3EC] rounded-md px-3 py-2 text-sm text-[#14213D] focus:outline-none focus:border-[#1F5FA8]" />
          </div>
        </div>
        <div>
          <label class="axm-mono text-[10px] tracking-wider text-[#5B6B82] uppercase">Email</label>
          <input type="email" data-field="email" value="${email}" placeholder="you@example.com"
            class="w-full mt-1 bg-[#F4F6F9] border border-[#DCE3EC] rounded-md px-3 py-2 text-sm text-[#14213D] focus:outline-none focus:border-[#1F5FA8]" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="axm-mono text-[10px] tracking-wider text-[#5B6B82] uppercase">Postcode</label>
            <input type="text" data-field="postcode" value="${postcode}" placeholder="e.g. TN14"
              class="w-full mt-1 bg-[#F4F6F9] border border-[#DCE3EC] rounded-md px-3 py-2 text-sm text-[#14213D] focus:outline-none focus:border-[#1F5FA8]" />
          </div>
          <div>
            <label class="axm-mono text-[10px] tracking-wider text-[#5B6B82] uppercase">Good Time To Call?</label>
            <select data-field="goodTime" class="w-full mt-1 bg-[#F4F6F9] border border-[#DCE3EC] rounded-md px-3 py-2 text-sm text-[#14213D] focus:outline-none focus:border-[#1F5FA8]">
              <option value="">Select a time</option>
              <option value="Morning" ${goodTime === "Morning" ? "selected" : ""}>Morning</option>
              <option value="Afternoon" ${goodTime === "Afternoon" ? "selected" : ""}>Afternoon</option>
              <option value="Evening" ${goodTime === "Evening" ? "selected" : ""}>Evening</option>
            </select>
          </div>
        </div>

        <label class="flex items-start gap-2.5 pt-1 cursor-pointer">
          <input type="checkbox" data-field="consent" ${consent ? "checked" : ""}
            class="mt-0.5 flex-shrink-0 w-4 h-4 rounded border-[#B9C3D1] text-[#1F5FA8] focus:ring-[#1F5FA8]" />
          <span class="text-[12px] text-[#5B6B82] leading-snug">
            I agree to be contacted by VanSecure about my quote, in line with their
            <a href="https://vansecure.co.uk/privacy-policy/" target="_blank" rel="noopener" class="text-[#1F5FA8] underline hover:no-underline">Privacy Policy</a>.
          </span>
        </label>

        <button type="submit" ${canSubmit ? "" : "disabled"}
          class="w-full mt-2 rounded-md py-3.5 flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm transition-all
            ${canSubmit ? "bg-[#C79A3D] text-white hover:bg-[#B78A2F]" : "bg-[#EAEEF3] text-[#8593A8] cursor-not-allowed"}">
          Get My Free Risk Report ${iconTag("arrow-right", 16)}
        </button>
      </form>

      ${navButtonsHTML(false)}
    </div>
  `;
}

/* ---------------------- Main render ---------------------- */

/* ---------------------- Safe icon rendering ---------------------- */
/* lucide is loaded from a CDN — if it's blocked or slow (ad blockers,
 * corporate networks, flaky connections all do this in the real world),
 * calling lucide.createIcons() directly throws and crashes the whole app.
 * This guards against that and retries once the script actually arrives. */
let lucideRetryScheduled = false;
function safeCreateIcons() {
  if (typeof lucide !== "undefined" && lucide.createIcons) {
    lucide.createIcons();
  } else if (!lucideRetryScheduled) {
    lucideRetryScheduled = true;
    setTimeout(() => {
      lucideRetryScheduled = false;
      if (typeof lucide !== "undefined" && lucide.createIcons) lucide.createIcons();
    }, 500);
  }
}

function render() {
  document.getElementById("app").innerHTML = `
    <header class="bg-white border-b border-[#DCE3EC]">
      <div class="max-w-lg mx-auto px-5 py-3.5 flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-md bg-[#0F2C54] flex items-center justify-center text-white">
          ${iconTag("shield", 16)}
        </div>
        <div class="axm-display text-base tracking-wide uppercase text-[#0F2C54]">VanSecure</div>
        <div class="ml-auto flex items-center gap-1 text-[#C79A3D]">
          ${Array.from({ length: 5 }).map(() => `<i data-lucide="star" style="width:11px;height:11px;fill:#C79A3D;color:#C79A3D"></i>`).join("")}
        </div>
      </div>
    </header>

    <main class="max-w-lg mx-auto px-5 py-8">
      <div class="border border-[#DCE3EC] rounded-xl bg-white p-5 sm:p-7 shadow-[0_1px_3px_rgba(15,44,84,0.06)]">
        ${progressHTML()}
        ${state.step === 1 ? step1HTML() : state.step === 2 ? step2HTML() : state.step === 3 ? step3HTML() : step4HTML()}
      </div>
      <p class="text-center text-[11px] text-[#8593A8] mt-5">
        Takes under 2 minutes · No obligation · We'll never share your details
      </p>
    </main>

    <footer class="text-center py-5 text-[11px] text-[#8593A8]">
      Copyright VanSecure © 2026. All rights reserved.
    </footer>
  `;

  safeCreateIcons();
  attachListeners();
}

/* ---------------------- Event handling ---------------------- */

function attachListeners() {
  const app = document.getElementById("app");

  app.querySelectorAll("[data-action]").forEach((el) => {
    el.addEventListener("click", () => {
      const action = el.dataset.action;
      const id = el.dataset.id;

      if (action === "next") { state.step = Math.min(4, state.step + 1); window.scrollTo(0, 0); render(); return; }
      if (action === "back") { state.step = Math.max(1, state.step - 1); window.scrollTo(0, 0); render(); return; }

      if (action === "toggle-use") toggleSetItem(state.vanInfo.uses, id);
      if (action === "switch-mode") {
        state.vanInfo.mode = id;
        if (id === "reg") clearRegResult();
      }
      if (action === "clear-reg-result") clearRegResult();
      if (action === "set-stolen") state.worries.stolen = id;
      if (action === "toggle-worry") toggleSetItem(state.worries.worryList, id);
      if (action === "toggle-existing") toggleSetItem(state.upgrades.existing, id);
      if (action === "toggle-interested") toggleSetItem(state.upgrades.interested, id);
      if (action === "set-wants-app") state.upgrades.wantsApp = id;
      if (action === "set-budget") state.upgrades.budget = id;

      render();
    });
  });

  app.querySelectorAll("[data-field]").forEach((el) => {
    el.addEventListener("change", (e) => {
      const field = el.dataset.field;
      const val = e.target.value;
      if (field === "make") { state.vanInfo.make = val; state.vanInfo.model = ""; render(); return; }
      if (field === "model") { state.vanInfo.model = val; render(); return; }
      if (field === "year") { state.vanInfo.year = val; render(); return; }
      if (field === "existingOther") { state.upgrades.existingOther = val; return; }
      if (field === "name") { state.contact.name = val; }
      if (field === "phone") { state.contact.phone = val; }
      if (field === "email") { state.contact.email = val; }
      if (field === "postcode") { state.contact.postcode = val; }
      if (field === "goodTime") { state.contact.goodTime = val; }
      if (field === "consent") { state.contact.consent = e.target.checked; }
      updateSubmitState();
    });
    el.addEventListener("input", (e) => {
      const field = el.dataset.field;
      if (["name", "phone", "email", "postcode"].includes(field)) {
        state.contact[field] = e.target.value;
        updateSubmitState();
      }
    });
  });

  const form = document.getElementById("lead-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const { name, phone, email, consent } = state.contact;
      if (!(name.trim() && phone.trim() && email.trim() && consent)) return;

      const { current, possible } = computeScores();
      const payload = {
        vanInfo: {
          ...state.vanInfo,
          uses: Array.from(state.vanInfo.uses),
        },
        worries: {
          stolen: state.worries.stolen,
          worryList: Array.from(state.worries.worryList),
        },
        upgrades: {
          existing: Array.from(state.upgrades.existing),
          existingOther: state.upgrades.existingOther,
          interested: Array.from(state.upgrades.interested),
          wantsApp: state.upgrades.wantsApp,
          budget: state.upgrades.budget,
        },
        scores: { current, possible },
        contact: state.contact,
        submittedAt: new Date().toISOString(),
      };
      console.log("VanSecure risk profile submission:", JSON.stringify(payload, null, 2));
      sendLeadToWebhook(payload);

      state.submitted = true;
      window.scrollTo(0, 0);
      render();
    });
  }
}

function toggleSetItem(set, id) {
  if (set.has(id)) set.delete(id);
  else set.add(id);
}

function clearRegResult() {
  const v = state.vanInfo;
  v.make = ""; v.model = ""; v.year = ""; v.regLookupConfirmed = false;
  v.registration = ""; v.bodyType = ""; v.wheelbase = ""; v.roofHeight = ""; v.colour = "";
}

function updateSubmitState() {
  const btn = document.querySelector('#lead-form button[type="submit"]');
  if (!btn) return;
  const { name, phone, email, consent } = state.contact;
  const canSubmit = name.trim() && phone.trim() && email.trim() && consent;
  btn.disabled = !canSubmit;
  btn.className = `w-full mt-2 rounded-md py-3.5 flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm transition-all
    ${canSubmit ? "bg-[#C79A3D] text-white hover:bg-[#B78A2F]" : "bg-[#EAEEF3] text-[#8593A8] cursor-not-allowed"}`;
}

/* ---------------------- Reg lookup iframe integration ---------------------- */
/*
 * Confirmed by Ben (2026-08-24). Message contract from
 * https://vsops.vansecure.co.uk/embed/reg-lookup on every successful lookup:
 *   { type: 'vsops:reg-lookup', registration, make, model, bodyType,
 *     wheelbase, roofHeight, yearOfManufacture, colour }
 * Any absent field arrives as null. If the manual-dropdown model list
 * doesn't include the returned model (e.g. a variant we haven't listed),
 * we still accept the lookup and fall back to "Other" for the dropdown
 * rather than rejecting a valid registration.
 */
window.addEventListener("message", (event) => {
  if (event.origin !== "https://vsops.vansecure.co.uk") return;
  const data = event.data || {};
  if (data.type !== "vsops:reg-lookup") return;

  const make = data.make || "";
  const model = data.model || "";
  const year = data.yearOfManufacture ? String(data.yearOfManufacture) : "";

  if (!make) return;

  state.vanInfo.make = MAKE_MODELS[make] ? make : "Other / Not Listed";
  state.vanInfo.model = MAKE_MODELS[state.vanInfo.make]?.includes(model) ? model : (model || "");
  state.vanInfo.year = year;
  state.vanInfo.regLookupConfirmed = true;

  // Extra detail from the lookup — not shown in the quiz UI, but carried
  // through to the final lead payload so the ops team gets the full picture.
  state.vanInfo.registration = data.registration || "";
  state.vanInfo.bodyType = data.bodyType || "";
  state.vanInfo.wheelbase = data.wheelbase || "";
  state.vanInfo.roofHeight = data.roofHeight || "";
  state.vanInfo.colour = data.colour || "";

  render();
});

render();
</script>
