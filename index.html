const ALL_OPTIONS = SECTIONS.flatMap((section) =>
  section.groups.flatMap((group) =>
    group.options.map((opt) => ({
      ...opt,
      sectionId: section.id,
      sectionTitle: section.title,
      sectionType: section.type,
    }))
  )
);
const OPTION_BY_ID = Object.fromEntries(ALL_OPTIONS.map((o) => [o.id, o]));

const MAX_POINTS = SECTIONS.reduce((total, section) => {
  const opts = section.groups.flatMap((g) => g.options);
  if (section.type === "multi") return total + opts.reduce((s, o) => s + o.weight, 0);
  return total + Math.max(...opts.map((o) => o.weight));
}, 0);

const VEHICLE_SPECS = [
  { id: "highRoof", label: "High roof van" },
  { id: "existingLocks", label: "Existing aftermarket locks or plates fitted" },
  { id: "hasWindows", label: "Windows fitted in side or back doors" },
  { id: "hasRacking", label: "Racking or equipment fixed inside the sliding door" },

/* ---------------------------- App state ---------------------------- */

  selectedOptions: new Set(),
  openSection: SECTIONS[0].id,
  otherWork: "",
  lead: { name: "", email: "", phone: "" },
  submitted: false,

/* ---------------------------- Gauge math ---------------------------- */

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

function gaugeSVG(score) {
  const cx = 110, cy = 108, r = 88, strokeWidth = 14;
  const angleForPercent = (p) => 180 - (p / 100) * 180;
  const circumference = Math.PI * r;
  const dashOffset = circumference * (1 - score / 100);
  const ticks = [0, 25, 50, 75, 100];
  const needleAngle = angleForPercent(score);
  const needleTip = polarPoint(cx, cy, r - 22, needleAngle);
  const zoneColor = score < 35 ? "#C0483A" : score < 70 ? "#C79A3D" : "#1F8A5C";

  const tickLines = ticks.map((t) => {
    const a = angleForPercent(t);
    const inner = polarPoint(cx, cy, r - strokeWidth / 2 - 4, a);
    const outer = polarPoint(cx, cy, r + strokeWidth / 2 + 4, a);
    return `<line x1="${inner.x}" y1="${inner.y}" x2="${outer.x}" y2="${outer.y}" stroke="#B9C3D1" stroke-width="2" />`;
  }).join("");

  return `
    <svg viewBox="0 0 220 130" class="w-full max-w-[280px]">
      <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="#E2E7EE" stroke-width="${strokeWidth}" stroke-linecap="round" />
      <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="${zoneColor}" stroke-width="${strokeWidth}" stroke-linecap="round"
        stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" style="transition: stroke-dashoffset 500ms ease, stroke 500ms ease" />
      ${tickLines}
      <line x1="${cx}" y1="${cy}" x2="${needleTip.x}" y2="${needleTip.y}" stroke="#0F2C54" stroke-width="2.5" stroke-linecap="round" style="transition: all 500ms ease" />
      <circle cx="${cx}" cy="${cy}" r="5" fill="#0F2C54" />
    </svg>
    <div class="-mt-6 flex flex-col items-center">
      <span class="axm-mono text-4xl font-semibold tracking-tight" style="color:${zoneColor}">
        ${score}<span class="text-lg align-top">%</span>
      </span>
      <span class="axm-mono text-[10px] tracking-[0.25em] text-[#5B6B82] mt-1">COVERAGE SCORE</span>
    </div>
  `;
}

/* ---------------------------- Render helpers ---------------------------- */

function iconTag(name, size, cls) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${cls || ''}"></i>`;
}

function optionCardHTML(opt, section) {
  const selected = state.selectedOptions.has(opt.id);
  const shape = section.type === "single" ? "rounded-full" : "rounded";
  return `
    <button type="button" data-action="toggle-option" data-option="${opt.id}" data-section="${section.id}"
      class="w-full text-left rounded-md border px-3 py-2.5 flex items-center gap-3 transition-all

      <span class="flex-shrink-0 w-4 h-4 flex items-center justify-center border transition-colors ${shape}
        ${selected ? "bg-[#1F5FA8] border-[#1F5FA8]" : "border-[#B9C3D1]"}">
        ${selected ? iconTag("check", 11, "text-white") : ""}
      </span>
      <span class="text-sm ${selected ? "text-[#0F2C54] font-medium" : "text-[#3B4A61]"}">${opt.name}</span>
    </button>
  `;
}

function accordionSectionHTML(section) {
  const isOpen = state.openSection === section.id;
  const selectedCount = section.groups.flatMap((g) => g.options).filter((o) => state.selectedOptions.has(o.id)).length;

  const groupsHTML = section.groups.map((group) => `
    <div>
      ${section.groups.length > 1 ? `<div class="axm-mono text-[10px] tracking-[0.2em] text-[#1F5FA8] mb-2 uppercase">${group.label}</div>` : ""}
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        ${group.options.map((opt) => optionCardHTML(opt, section)).join("")}
      </div>
    </div>
  `).join("");

  return `
    <div class="border border-[#DCE3EC] rounded-lg overflow-hidden bg-white shadow-[0_1px_2px_rgba(15,44,84,0.04)]">
      <button type="button" data-action="toggle-section" data-section="${section.id}"
        class="w-full flex items-center justify-between px-4 py-3.5 bg-[#F4F6F9] hover:bg-[#EAEEF3] transition-colors">
        <div class="flex items-center gap-3">
          <span class="flex-shrink-0 w-8 h-8 rounded-md bg-white border border-[#DCE3EC] flex items-center justify-center text-[#1F5FA8]">
            ${iconTag(section.icon, 16)}
          </span>
          <div class="text-left">
            <div class="axm-display text-[#0F2C54] text-[15px] tracking-wide uppercase">${section.title}</div>
            <div class="axm-mono text-[10px] text-[#5B6B82] tracking-wider">${section.sub}</div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          ${selectedCount > 0 ? `<span class="axm-mono text-[11px] px-2 py-0.5 rounded-full bg-[#1F5FA8]/10 text-[#1F5FA8] border border-[#1F5FA8]/25">${selectedCount} selected</span>` : ""}
          ${iconTag("chevron-down", 16, `text-[#5B6B82] transition-transform ${isOpen ? "rotate-180" : ""}`)}
        </div>
      </button>
      ${isOpen ? `<div class="px-4 py-4 space-y-4">${groupsHTML}</div>` : ""}
    </div>
  `;
}

function vehicleDetailsHTML() {

function summarySection() {
  const map = {};
  Array.from(state.selectedOptions).forEach((id) => {
    const opt = OPTION_BY_ID[id];
    if (!opt) return;
    if (!map[opt.sectionTitle]) map[opt.sectionTitle] = [];
    map[opt.sectionTitle].push(opt.name);
  });
  const hasAny = state.selectedOptions.size > 0;

  const body = !hasAny
    ? `<p class="text-sm text-[#8593A8] axm-mono">No hardware selected yet.</p>`
    : `<div class="space-y-3 max-h-64 overflow-y-auto pr-1">
        ${Object.entries(map).map(([title, items]) => `
          <div>
            <div class="axm-mono text-[10px] tracking-[0.2em] text-[#1F5FA8] uppercase mb-1">${title}</div>
            <ul class="space-y-1">
              ${items.map((name) => `
                <li class="text-[13px] text-[#3B4A61] flex items-start gap-2">
                  <span class="text-[#1F8A5C] mt-0.5">${iconTag("check", 12)}</span>${name}
                </li>`).join("")}
            </ul>
          </div>`).join("")}
      </div>`;

  return `
    <div class="border border-[#DCE3EC] rounded-lg bg-white p-4">
      <h3 class="axm-display uppercase tracking-wide text-sm text-[#1F5FA8] mb-3">Build Summary</h3>
      ${body}
    </div>
  `;
}

function computeScore() {
  const points = Array.from(state.selectedOptions).reduce((sum, id) => sum + (OPTION_BY_ID[id]?.weight || 0), 0);
  return Math.min(100, Math.round((points / MAX_POINTS) * 100));
}

      </div>

      </div>
      <div>

      </div>

      <button type="submit" ${canSubmit ? "" : "disabled"}
        class="w-full mt-2 rounded-md py-3 flex items-center justify-center gap-2 axm-display uppercase tracking-wide text-sm transition-all

        </div>

          <div class="axm-mono text-[11px] text-[#5B6B82] tracking-wide">Build your fit-out. Get a custom Price &amp; Risk Report.</div>
        </div>

        </section>
      </div>

      <div class="lg:sticky lg:top-6 self-start space-y-4">
        ${state.submitted ? successStateHTML(score) : `
          <div class="border border-[#DCE3EC] rounded-lg bg-white p-5">${gaugeSVG(score)}</div>
          ${summarySection()}
          ${leadFormHTML()}
        `}
      </div>
    </main>
  `;

  lucide.createIcons();
  attachListeners();
}

/* ---------------------------- Event handling ---------------------------- */

function attachListeners() {
  document.querySelectorAll('[data-action="toggle-section"]').forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.section;
      state.openSection = state.openSection === id ? null : id;
      render();
    });
  });

  document.querySelectorAll('[data-action="toggle-spec"]').forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.spec;
      state.vehicleSpec[id] = !state.vehicleSpec[id];
      render();
    });
  });

  document.querySelectorAll('[data-action="toggle-option"]').forEach((el) => {
    el.addEventListener("click", () => {
      const optionId = el.dataset.option;
      const sectionId = el.dataset.section;
      const section = SECTIONS.find((s) => s.id === sectionId);
      if (section.type === "single") {
        section.groups.flatMap((g) => g.options).forEach((o) => state.selectedOptions.delete(o.id));
        if (!state.selectedOptions.has(optionId)) state.selectedOptions.add(optionId);
        else state.selectedOptions.delete(optionId);
      } else {
        if (state.selectedOptions.has(optionId)) state.selectedOptions.delete(optionId);
        else state.selectedOptions.add(optionId);
      }
      render();
    });
  });

  const otherWorkEl = document.getElementById("other-work");
  if (otherWorkEl) {
    otherWorkEl.addEventListener("input", (e) => {
      state.otherWork = e.target.value;
    });
  }

  document.querySelectorAll("[data-field]").forEach((el) => {
    el.addEventListener("input", (e) => {
      state.lead[el.dataset.field] = e.target.value;
      // Re-render only to toggle submit button enabled state, preserving focus is a fair tradeoff here.
      const submitBtn = document.querySelector('#lead-form button[type="submit"]');
      const hasAny = state.selectedOptions.size > 0;
      const canSubmit = state.lead.name.trim() && state.lead.email.trim() && hasAny;
      if (submitBtn) submitBtn.disabled = !canSubmit;
    });
  });

  const form = document.getElementById("lead-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const hasAny = state.selectedOptions.size > 0;
      const canSubmit = state.lead.name.trim() && state.lead.email.trim() && hasAny;
      if (!canSubmit) return;

      const score = computeScore();
      const summaryBySection = {};
      Array.from(state.selectedOptions).forEach((id) => {
        const opt = OPTION_BY_ID[id];
        if (!opt) return;
        if (!summaryBySection[opt.sectionTitle]) summaryBySection[opt.sectionTitle] = [];
        summaryBySection[opt.sectionTitle].push(opt.name);
      });

      const payload = {
        vehicleSpec: state.vehicleSpec,
        selections: Array.from(state.selectedOptions).map((id) => {
          const o = OPTION_BY_ID[id];
          return { id: o.id, name: o.name, section: o.sectionTitle, weight: o.weight };
        }),
        otherWork: state.otherWork,
        coverageScore: score,
        lead: state.lead,
        submittedAt: new Date().toISOString(),
      };
      console.log("VanSecure configurator submission:", JSON.stringify(payload, null, 2));

      state.submitted = true;
      render();

      const lines = [
        `Hi VanSecure, I've just built a security spec online — ${score}% coverage.`,
        "",
        `Name: ${state.lead.name}`,
        state.lead.phone ? `Phone: ${state.lead.phone}` : null,
        state.lead.email ? `Email: ${state.lead.email}` : null,
        "",
        "Selected hardware:",
        ...Object.entries(summaryBySection).flatMap(([section, items]) => [
          `${section}:`,
          ...items.map((name) => `- ${name}`),
        ]),
        state.otherWork.trim() ? "" : null,
        state.otherWork.trim() ? `Other work: ${state.otherWork.trim()}` : null,
      ].filter(Boolean);

      const message = lines.join("\n");
      const whatsappUrl = `https://wa.me/+447858192831?text=${encodeURIComponent(message)}`;
      window.location.href = whatsappUrl;
    });
  }
}

render();
</script>
</body>
</html>
